# Broadsheet: a paper ground rather than white, editorial serif, and two accents that carry
# meaning -- cyan for the deterministic layer, magenta for anything the clinician must not
# skim past. The palette matches the design tokens declared in app.py, so Streamlit's own
# chrome does not fight the page.
[theme]
base = "light"
primaryColor = "#d6006c"
backgroundColor = "#f3f2f2"
secondaryBackgroundColor = "#eae9e9"
textColor = "#201e1d"
font = "serif"

[server]
headless = true

[browser]
gatherUsageStats = false
