# POCUS Copilot: the design's violet system. Lavender ground rather than white, deep violet
# primary, and status colour reserved for clinical meaning — red for critical, amber for
# warning, green for normal. Matches the tokens declared in app.py so Streamlit's own chrome
# does not fight the page.
[theme]
base = "light"
primaryColor = "#5B3CC4"
backgroundColor = "#F5F3FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
