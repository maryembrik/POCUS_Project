        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();
              if (done) break;

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

icky;top:0;height:100vh;overflow:auto\">\n  <div style=\"display:flex;align-items:center;gap:12px;padding:0 8px\">\n    <div style=\"width:40px;height:40px;border-radius:12px;background:#5B54D6;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px\">P<\u002Fdiv>\n    <div>\n      <div style=\"font-weight:800;font-size:15.5px;letter-spacing:-.01em\">POCUS-Emergency<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8A87A8\">Clinical Copilot<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <nav style=\"display:flex;flex-direction:column;gap:5px\">\n    <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"10\">\n      <button type=\"button\" sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.style }}\">\n        <span style=\"display:flex;align-items:center;gap:11px\">\n          <span style=\"width:18px;text-align:center;font-size:14px\">{{ item.icon }}<\u002Fspan>\n          <span>{{ item.label }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"{{ item.badgeStyle }}\">{{ item.badge }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <div style=\"margin-top:auto;background:#EFEEFB;border-radius:16px;padding:16px 18px\">\n    <div style=\"font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7C5CFC;font-weight:700\">Current patient<\u002Fdiv>\n    <div style=\"margin-top:8px;font-weight:700;font-size:15px\">Sarah Martin<\u002Fdiv>\n    <div style=\"font-size:13px;color:#6A6785\">74 · Female · Acute breathlessness<\u002Fdiv>\n    <div style=\"margin-top:12px;display:inline-flex;align-items:center;gap:7px;background:#FDECEC;color:#C13238;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700\">● High priority<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:11px;padding:0 8px 4px\">\n    <div style=\"width:34px;height:34px;border-radius:50%;background:#E4E2F8;display:flex;align-items:center;justify-content:center;font-weight:700;color:#5B3CC4;font-size:13px\">AR<\u002Fdiv>\n    <div style=\"line-height:1.25\"><div style=\"font-weight:600;font-size:13.5px\">Dr. A. Reyes<\u002Fdiv><div style=\"font-size:12px;color:#8A87A8\">Emergency Medicine<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Faside>\n\n<div style=\"display:flex;flex-direction:column;min-width:0\">\n\n<header style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 40px;background:#2E2A78;border-bottom:1px solid #2E2A78;position:sticky;top:0;z-index:5\">\n  <div style=\"display:flex;align-items:center;gap:14px;flex:1;min-width:0\">\n    <div style=\"flex:1;max-width:420px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:11px 18px;color:#C9C6EE;font-size:14px\">\n      <span style=\"display:flex;gap:10px;align-items:center\"><span>⌕<\u002Fspan><span>Search patients, findings, reports…<\u002Fspan><\u002Fspan>\n      <span style=\"color:#B4ACC8\">⚙<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:14px\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);color:#C6F24E;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700\"><span class=\"livedot\">●<\u002Fspan> Assistant ready<\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ goWorkup }}\" style=\"appearance:none;border:0;cursor:pointer;background:#C6F24E;color:#1B1A3A;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px\" style-hover=\"filter:brightness(1.06)\">+ New assessment<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"padding:34px 40px 72px;display:flex;flex-direction:column;gap:26px\">\n\n<sc-if value=\"{{ onHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:26px\">\n  <section style=\"background:linear-gradient(135d 91,60,196,.06)\" style-hover=\"border-color:#B9B5EC\">\n      <span style=\"width:40px;height:40px;border-radius:12px;background:#EFEEFB;display:flex;align-items:center;justify-content:center;font-size:19px\">📄<\u002Fspan>\n      <span style=\"font-weight:700;font-size:16.5px;margin-top:6px\">Generate a report<\u002Fspan>\n      <span style=\"font-size:13.5px;color:#6A6785\">Create a standardized clinical summary.<\u002Fspan>\n      <span style=\"margin-top:6px;color:#5B3CC4;font-weight:700;font-size:13.5px\">Reports →<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;border:1px solid #E4E2F8;border-radius:20px;padding:26px 28px;box-shadow:0 6px 20px rgba(91,60,196,.05)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em\">Recent assessments<\u002Fh2>\n      <button type=\"button\" sc-camel-on-click=\"{{ goHistory }}\" style=\"appearance:none;border:0;background:none;cursor:pointer;color:#5B3CC4;font-weight:700;font-size:13.5px\">View all →<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:18px;font-size:14.5px\">\n      <sc-raw-thead>\n        <sc-raw-tr style=\"text-align:left;color:#8A87A8;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase\">\n          <sc-raw-th style=\"padding:0 0 12px;font-weight:700\">Patient<\u002Fsc-raw-th><sc-raw-th style=\"padding:0 0 12px;font-weight:700\">Age<\u002Fsc-raw-th><sc-raw-th style=\"padding:0 0 12px;font-weight:700\">Reason<\u002Fsc-raw-th><sc-raw-th style=\"padding:0 0 12px;font-weight:700\">Status<\u002Fsc-raw-th><sc-raw-th style=\"padding:0 0 12px;font-weight:700;text-align:right\">Time<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr style=\"border-top:1px solid #E9E8FB\"><sc-raw-td style=\"padding:14px 0;font-weig ceholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:22px;max-width:1240px\">\n  <div class=\"rise\" style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n    <div>\n      <h1 style=\"margin:0;font-size:33px;font-weight:800;letter-spacing:-.022em\">Patient workup<\u002Fh1>\n      <p style=\"margin:8px 0 0;color:#6A6785;font-size:15.5px;max-width:70ch;text-wrap:pretty\">Enter everything you have on one page — history, vital signs, laboratory results and POCUS. Then analyze. Anything left blank is recorded as not provided, never as normal.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n      <span style=\"background:#E9E8FB;color:#2E2A78;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700\">{{ filledCount }} of 5 sections filled<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ onAnalyze }}\" style=\"appearance:none;border:0;cursor:pointer;background:#5B54D6;color:#fff;font-weight:700;font-size:14.5px;padding:13px 24px;border-radius:999px\">✦ Analyze patient<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;align-items:start\">\n\n    <section class=\"rise\" style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px\">\n        <h2 style=\"margin:0;font-size:16.5px;font-weight:800\">1 · Patient &amp; history<\u002Fh2>\n        <image-slot id=\"wk-photo\" shape=\"circle\" style=\"width:40px;height:40px;flex:0 0 auto\" placeholder=\"Photo\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#6A6785\">Name<input value=\"Sarah Martin\" style=\"border:1px solid #DEDCF4;border-radius:8px;padding:10px 12px;font-size:14.5px;background:#FAFAFE\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#6A6785\">Age<input value=\"74\" style=\"border:1px solid #DEDCF4;border-radius:8px;padding:10px 12px;font-size:14.5px;background:#FAFAFE\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#6A6785\">Sex<sc-raw-select style=\"border:1px solid #DEDCF4;border-radius:8px;padding:10px 12px;font-size:14.5px;background:#FAFAFE\"><option>Female<\u002Foption><option>Male<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n      <\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#6A6785\">Chief complaint<input value=\"Acute breathlessness\" style=\"border:1px solid #DEDCF4;border-radius:8px;padding:11px 12px;font-size:15px;font-weight:600;background:#FAFAFE\"><\u002Flabel>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"background:#E4E2F8;color:#2E2A78;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700\">Dyspnea<\u002Fspan>\n        <span style=\"background:#E4E2F8;color:#2E2A78;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700\">Fatigue<\u002Fspan>\n        <span style=\"background:#EFEEFB;color:#6A6785;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600\">+ Fever<\u002Fspan>\n        <span style=\"background:#EFEEFB;color:#6A6785;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600\">+ Chest pain<\u002Fspan>\n        <span style=\"background:#EFEEFB;color:#6A6785;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600\">+ Cough<\u002Fspan>\n      <\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#6A6785\">Medical history &amp; medications<textarea style=\"border:1px solid #DEDCF4;border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:64px;resize:vertical;background:#FAFAFE\">Hypertension, prior heart failure. On furosemide, ramipril.<\u002Ftextarea><\u002Flabel>\n    <\u002Fsection>\n\n    <section class=\"rise-2\" style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"margin:0;font-size:16.5px;font-weight:800\">2 · Vital signs<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px\">\n        <sc-for list=\"{{ vitalFields }}\" as=\"v\" hint-placeholder-count=\"6\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#6A6785\">{{ v.label }}<input value=\"{{ v.value }}\" placeholder=\"{{ v.unit }}\" style=\"{{ v.inputStyle }}\"><span style=\"{{ v.flagStyle }}\">{{ v.flag }}<\u002Fspan><\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#FFF8EC;border:1px solid #F7DFB4;border-radius:10px;padding:13px 15px;font-size:13.5px;color:#7A5A16\">Temperature is empty. It will be recorded as not measured.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"rise-3\" style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px\">\n        <h2 style=\"margin:0;font-size:16.5px;font-weight:800\">3 · Laboratory<\u002Fh2>\n        <button type=\"button\" style=\"appearance:none;border:1px solid #DEDCF4;background:#fff;cursor:pointer;color:#2E2A78;font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:8px\">+ Add test<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px\">\n        <sc-for list=\"{{ labFields }}\" as=\"l\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:1fr 108px 92px;gap:11px;align-items:center\">\n            <span style=\"{{ l.nameStyle }}\">{{ l.name }}<\u002Fspan>\n            <input value=\"{{ l.value }}\" placeholder=\"—\" style=\"{{ l.inputStyle }}\">\n            <span style=\"{{ l.flagStyle }}\">{{ l.flag }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"rise-4\" style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"margin:0;font-size:16.5px;font-weight:800\">4 · POCUS<\u002Fh2>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"background:#5B54D6;color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700\">Lung<\u002Fspan>\n        <span style=\"background:#EFEEFB;color:#6A6785;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600\">Cardiac<\u002Fspan>\n        <span style=\"background:#EFEEFB;color:#6A6785;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600\">FAST<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px\">\n        <div style=\"position:relative;aspect-ratio:4/3;background:#141824;border-radius:6px;overflow:hidden\"><image-slot id=\"wk-clip-1\" shape=\"rect\" placeholder=\"R2 ant\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"position:relative;aspect-ratio:4/3;background:#141824;border-radius:6px;overflow:hidden\"><image-slot id=\"wk-clip-2\" shape=\"rect\" placeholder=\"L2 ant\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"aspect-ratio:4/3;border:1px dashed #DEDCF4;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9C99B8;font-size:12.5px;text-align:center;padding:8px\">＋ Add clip<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ pocusFields }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px\">\n            <span style=\"{{ p.nameStyle }}\">{{ p.name }}<\u002Fspan>\n            <span style=\"{{ p.segStyle }}\">{{ p.value }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n        <sc-for list=\"{{ zones }}\" as=\"z\" hint-placeholder-count=\"8\"><div style=\"{{ z.style }}\">{{ z.label }}<\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <section class=\"rise\" style=\"background:#2E2A78;border-radius:14px;padding:26px 30px;color:#fff;display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;align-items:center\">\n    <div style=\"max-width:62ch\">\n      <div style=\"font-weight:800;font-size:18px\">5 · Analyze<\u002Fdiv>\n      <p style=\"margin:8px 0 0;font-size:14.5px;opacity:.86;text-wrap:pretty\">The assistant reads everything on this page at once and returns a ranked assessment with what supports it, what limits confidence, and what is missing.<\u002Fp>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ onAnalyze }}\" style=\"appearance:none;border:0;cursor:pointer;background:#C6F24E;color:#1B1A3A;font-weight:800;font-size:15px;padding:15px 28px;border-radius:999px\">{{ analyzeLabel }}<\u002Fbutton>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ analyzing }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:30px 32px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-weight:800;font-size:17px\">Analyzing this patient…<\u002Fdiv>\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;gap:12px;align-items:center;font-size:14.5px\">\n        <span style=\"{{ s.dotStyle }}\"><\u002Fspan><span style=\"{{ s.textStyle }}\">{{ s.label }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ analyzed }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <section class=\"alertpulse rise\" style=\"background:#FFF1F1;border:1px solid #F6CFCF;border-left:5px solid #E5484D;border-radius:14px;padding:20px 26px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center\">\n      <div>\n        <div style=\"font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:#C13238;font-weight:800\">High clinical priority<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:16px;max-width:70ch;text-wrap:pretty\">The current findings suggest a significant respiratory problem requiring prompt clinical evaluation.<\u002Fp>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ goAlerts }}\" style=\"appearance:none;border:1px solid #E9B4B4;background:#fff;cursor:pointer;color:#C13238;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:999px\">Review alerts →<\u002Fbutton>\n    <\u002Fsection>\n\n    <section class=\"rise-2\" style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:28px 30px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap\">\n        <div>\n          <h2 style=\"margin:0;font-size:21px;font-weight:800;letter-spacing:-.015em\">Assessment<\u002Fh2>\n          <p style=\"margin:6px 0 0;font-size:13.5px;color:#6A6785\">Offered for consideration. This is not a diagnosis.<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ goReport }}\" style=\"appearance:none;border:0;cursor:pointer;background:#5B54D6;color:#fff;font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:999px\">Generate report<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ ranked }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <article style=\"{{ r.cardStyle }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-size:12.5px;color:#8A87A8;font-weight:800\">{{ r.rank }}<\u002Fspan><span style=\"{{ r.titleStyle }}\">{{ r.name }}<\u002Fspan><\u002Fdiv>\n              <span style=\"{{ r.tagStyle }}\">{{ r.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;height:8px;background:#E9E8FB;border-radius:5px;overflow:hidden\"><div style=\"{{ r.fillStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px\">\n              <div>\n                <div style=\"font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#5A7A0F;font-weight:800\">Supports<\u002Fdiv>\n                <div style=\"margin-top:7px;font-size:14px;color:#1B1A3A\">{{ r.supports }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#9A6207;font-weight:800\">Limits confidence<\u002Fdiv>\n                <div style=\"margin-top:7px;font-size:14px;color:#6A6785\">{{ r.limits }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"rise-3\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n      <div style=\"background:#fff;border:1px solid #E4E2F8;border-radius:14px;padding:24px 26px\">\n        <h3 style=\"margin:0 0 6px;font-size:16.5px;font-weight:800\">What would clarify this case<\u002Fh3>\n        <p style=\"margin:0 0 14px;font-size:13.5px;color:#6A6785\">Not measured does not mean normal.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:12px;padding:13px 15px;background:#FFF8EC;border-radius:10px\"><span style=\"color:#E08A00\">●<\u002Fspan><div><div style=\"font-weight:700;font-size:14.5px\">D-dimer<\u002Fdiv><div style=\"font-size:13px;color:#6A6785\">May contribute to assessing pulmonary embolism.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;padding:13px 15px;background:#FFF8EC;border-radius:10px\"><span style=\"color:#E08A00\">●<\u002Fspan><div><div style=\"font-weight:700;font-size:14.5px\">Creatinine<\u002Fdiv><div style=\"font-size:13px;color:#6A6785\">Could guide treatment and renal contribution.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;padding:13px 15px;background:#EFEEFB;border-radius:10px\"><span style=\"color:#5B54D6\">●<\u002Fspan><div><div style=\"font-weight:700;font-size:14.5px\">Temperature<\u002Fdiv><div style=\"font-size:13px;color:#6A6785\">Would help weigh an infective cause.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#C6F24E;border-radius:14px;padding:24px 26px;color:#1B1A3A;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800\">Suggested next step<\u002Fdiv>\n        <p style=\"margin:0;font-size:19px;font-weight:800;line-height:1.35;text-wrap:pretty\">Obtain the missing high-priority investigations and reassess the respiratory status.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ goAssistant }}\" style=\"margin-top:auto;appearance:none;border:0;cursor:pointer;background:#1B1A3A;color:#fff;font-weight:700;font-size:14px;padding:12px 20px;border-radius:999px;align-self:flex-start\">Ask the assistant →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n\n\n<sc-if value=\"{{ onDiagnosis }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n  <section class=\"rise\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n    <div style=\"background:#5B54D6;border-radius:10px;padding:30px 34px;color:#fff;position:relative;overflow:hidden\">\n      <h1 style=\"margin:0;font-size:29px;font-weight:800;letter-spacing:-.02em;position:relative\">Good morning, Dr. Reyes<\u002Fh1>\n      <p style=\"margin:10px 0 0;font-size:15px;opacity:.9;position:relative\">You have 12 incomplete clinical tasks today<\u002Fp>\n      <div style=\"margin-top:22px;display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;position:relative\">\n        <span>✦ 23 suggestions<\u002Fspan><span>⚠ 8 anomalies<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"drift\" style=\"position:absolute;right:22px;top:22px;bottom:22px;width:170px\"><image-slot id=\"dx-illus\" shape=\"rounded\" radius=\"14\" placeholder=\"Illustration\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#C6F24E;border-radius:10px;padding:26px 30px;color:#1B1A3A\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\"><span style=\"font-weight:700;font-size:15.5px\">▤ Clinical assistant<\u002Fspan><span style=\"opacity:.7\">⋮<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:24px;display:flex;align-items:baseline;gap:9px\"><span style=\"font-size:36px;font-weight:800;letter-spacing:-.03em\">7,198<\u002Fspan><span style=\"font-size:14px;opacity:.9\">conversations<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:18px;display:flex;gap:7px\"><span style=\"flex:5;height:6px;background:#2E2A78;border-radius:3px\"><\u002Fspan><span style=\"flex:1;height:6px;background:rgba(46,42,120,.28);border-radius:3px\"><\u002Fspan><span style=\"flex:1;height:6px;background:rgba(46,42,120,.28);border-radius:3px\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"rise-2\" style=\"background:#fff;border:1px solid #E4E2F8;border-radius:10px;padding:28px 30px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-size:21px;font-weight:800;letter-spacing:-.015em\">▦ Differential diagnosis — supporting vs against<\u002Fh2>\n      <div style=\"display:flex;gap:22px;align-items:center;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:16px;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase\">\n          <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:11px;height:11px;background:#5B54D6\"><\u002Fspan>Supporting<\u002Fspan>\n          <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:11px;height:11px;background:#2E2A78\"><\u002Fspan>Against<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;border:1px solid #DEDCF4;border-radius:4px;overflow:hidden;font-size:13px;font-weight:700\">\n          <span style=\"padding:9px 16px;background:#1B1A3A;color:#fff\">24H<\u002Fspan><span style=\"padding:9px 16px;border-left:1px solid #DEDCF4;color:#6A6785\">7D<\u002Fspan><span style=\"padding:9px 16px;border-left:1px solid #DEDCF4;color:#6A6785\">ALL<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px;display:grid;grid-template-columns:38px 1fr;gap:12px\">\n      <div style=\"display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;color:#9C99B8;font-weight:600;height:280px;text-align:right\"><span>100<\u002Fspan><span>80<\u002Fspan><span>60<\u002Fspan><span>40<\u002Fspan><span>20<\u002 nt-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C5CFC;font-weight:800\">Symptoms<\u002Fdiv>\n      <div style=\"margin:8px 0 18px;font-size:14.5px\">Acute breathlessness, fatigue<\u002Fdiv>\n\n      <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C5CFC;font-weight:800\">Vital signs<\u002Fdiv>\n      <div style=\"margin:10px 0 18px;display:flex;flex-direction:column;gap:9px;font-size:14.5px\">\n        <div style=\"display:flex;justify-content:space-between\"><span>Heart rate 122 bpm<\u002Fspan><span style=\"color:#C13238;font-weight:700\">High<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>SpO₂ 88%<\u002Fspan><span style=\"color:#C13238;font-weight:700\">Low<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>Respiratory rate 28/min<\u002Fspan><span style=\"color:#9A6207;font-weight:700\">High<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>Blood pressure 104/68<\u002Fspan><span style=\"color:#5A7A0F;font-weight:700\">Normal<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C5CFC;font-weight:800\">POCUS<\u002Fdiv>\n      <div style=\"margin:8px 0 18px;font-size:14.5px\">B-lines detected — bilateral anterior zones<\u002Fdiv>\n\n      <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C5CFC;font-weight:800\">Laboratory<\u002Fdiv>\n      <div style=\"margin:10px 0 0;display:flex;flex-direction:column;gap:9px;font-size:14.5px\">\n        <div style=\"display:flex;justify-content:space-between\"><span>BNP 890<\u002Fspan><span style=\"color:#C13238;font-weight:700\">High<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>Troponin 62<\u002Fspan><span style=\"color:#C13238;font-weight:700\">High<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span>Lactate 2.6<\u002Fspan><span style=\"color:#9A6207;font-weight:700\">High<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;color:#9C99B8\"><span>D-dimer<\u002Fspan><span>Not available<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <div style=\"background:#fff;border:1px solid #E4E2F8;border-radius:20px;padding:26px 28px;box-shadow:0 6px 20px rgba(91,60,196,.05)\">\n        <h2 style=\"margin:0 0 4px;font-size:17px;font-weight:800\">Differential assessment<\u002Fh2>\n        <p style=\"margin:0 0 20px;font-size:13.5px;color:#6A6785\">Offered for consideration. This is not a diagnosis.<\u002Fp>\n\n        <article style=\"border:1px solid #DEDCF4;border-radius:16px;padding:20px 22px;background:#FCFBFF\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n            <div><span style=\"font-size:12.5px;color:#8A87A8;font-weight:700\">01 · Most likely<\u002Fspan><div style=\"font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:4px\">Pulmonary edema<\u002Fdiv><\u002Fdiv>\n            <span style=\"background:#E4E2F8;color:#2E2A78;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800\">Moderate likelihood<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;height:8px;border-radius:6px;background:#E4E2F8;overflow:hidden\"><div style=\"width:62%;height:100%;background:linear-gradient(90deg,#7C5CFC,#5B3CC4)\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px\">\n            <div>\n              <div style=\"font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#5A7A0F;font-weight:800\">Why it is considered<\u002Fdiv>\n              <ul style=\"margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px\">\n                <li>B-lines on lung ultrasound<\u002Fli><li>SpO₂ 88%<\u002Fli><li>Heart rate 122 bpm<\u002Fli><li>Respiratory rate 28/min<\u002Fli><li>BNP elevated<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#9A6207;font-weight:800\">What limits confidence<\u002Fdiv>\n              <ul style=\"margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px;color:#6A6785\">\n                <li>Important investigations remain unavailable<\u002Fli><li>The examination cannot establish normality<\u002Fli><li>Some conditions were not assessed<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;display:flex;gap:10px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ askWhy }}\" style=\"appearance:none;border:0;cursor:pointer;background:#5B3CC4;color:#fff;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:11px\">Why?<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ askChallenge }}\" style=\"appearance:none;border:1px solid #B9B5EC;background:#fff;cursor:pointer;color:#5B3CC4;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:11px\">🔍 Challenge this assessment<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"margin-top:16px;border:1px solid #E4E2F8;border-radius:16px;padding:20px 22px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n            <div><span style=\"font-size:12.5px;color:#8A87A8;font-weight:700\">02<\u002Fspan><div style=\"font-size:19px;font-weight:700;margin-top:4px\">Pulmonary embolism<\u002Fdiv><\u002Fdiv>\n            <span style=\"background:#EFEEFB;color:#5B3CC4;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700\">Low–moderate<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;height:8px;border-radius:6px;background:#F1EDFF;overflow:hidden\"><div style=\"width:34%;height:100%;background:#8E88E8\"><\u002Fdiv><\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:14px;color:#6A6785;text-wrap:pretty\">Tachycardia and tachypnea are compatible. The ultrasound findings favour another pulmonary process, and no available result can exclude it.<\u002Fp>\n        <\u002Farticle>\n\n        <article style=\"margin-top:16px;border:1px solid #E4E2F8;border-radius:16px;padding:20px 22px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n            <div><span style=\"font-size:12.5px;color:#8A87A8;font-weight:700\">03<\u002Fspan><div style=\"font-size:19px;font-weight:700;margin-top:4px\">Pneumothorax<\u002Fdiv><\u002Fdiv>\n            <span style=\"background:#FFF3E0;color:#9A6207;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700\">Cannot be excluded<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:14px;color:#6A6785\">The current examination does not assess this condition.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E4E2F8;border-radius:20px;padding:26px 28px;box-shadow:0 6px 20px rgba(91,60,196,.05)\">\n        <h2 style=\"margin:0 0 4px;font-size:17px;font-weight:800\">What would help clarify this case?<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:13.5px;color:#6A6785\">These tests were not performed. Their absence does not mean they are normal.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:14px;padding:14px 16px;background:#FFF8EC;border-radius:14px\"><span style=\"color:#E08A00;font-size:15px\">●<\u002Fspan><div><div style=\"font-weight:700;font-size:15px\">D-dimer<\u002Fdiv><div style=\"font-size:13.5px;color:#6A6785\">May contribute to the assessment of pulmonary embolism.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:14px 16px;background:#FFF8EC;border-radius:14px\"><span style=\"color:#E08A00;font-size:15px\">●<\u002Fspan><div><div style=\"font-weight:700;font-size:15px\">Creatinine<\u002Fdiv><div style=\"font-size:13.5px;color:#6A6785\">Could help evaluate renal contribution and guide treatment.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:14px;padding:14px 16px;background:#EFEEFB;border-radius:14px\"><span style=\"color:#7C5CFC;font-size:15px\">●<\u002Fspan><div><div style=\"font-weight:700;font-size:15px\">Temperature<\u002Fdiv><div style=\"font-size:13.5px;color:#6A6785\">Would help weigh an infective cause.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;padding-top:18px;border-top:1px solid #E9E8FB\">\n          <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C5CFC;font-weight:800\">Suggested next step<\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:18px;font-weight:700;line-height:1.35;text-wrap:pretty\">Consider obtaining the missing high-priority investigations and reassessing the patient's respiratory status.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:linear-gradient(135deg,#5B3CC4,#7C5CFC);border-radius:20px;padding:26px 30px;color:#fff;display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;align-items:center\">\n    <div style=\"max-width:60ch\">\n      <div style=\"font-weight:800;font-size:18px\">✨ Ask the clinical assistant<\u002Fdiv>\n      <p style=\"margin:8px 0 0;font-size:14.5px;opacity:.92\">Discuss this case in plain language — what supports the leading possibility, what argues against it, what is still missing.<\u002Fp>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ goAssistant }}\" style=\"appearance:none;border:0;cursor:pointer;background:#fff;color:#5B3CC4;font-weight:800;font-size:14.5px;padding:13px 22px;border-radius:12px\">Open assistant<\u002Fbutton>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onAlerts }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:22px;max-width:1000px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n    <div>\n      <h1 style=\"margin:0 0 8px;font-size:32px;font-weight:800;letter-spacing:-.02em\">Clinical alerts<\u002Fh1>\n      <p style=\"margin:0;color:#6A6785;font-size:15.5px\">3 alerts require physician attention<\u002Fp>\n    <\u002Fdiv>\n    <button type=\"button\" style=\"appearance:none;border:1px solid #DEDCF4;background:#fff;cursor:pointer;color:#5B3CC4;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:11px\">Acknowledge non-critical<\u002Fbutton>\n  <\u002Fdiv>\n\n  <section style=\"background:#fff;border:1px solid #F6CFCF;border-left:5px solid #E5484D;border-radius:18px;padding:22px 26px\">\n    <div style=\"font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:#C13238;font-weight:800\">Immediate attention<\u002Fdiv>\n    <h2 style=\"margin:10px 0 6px;font-size:21px;font-weight:800\">Oxygenation is compromised<\u002Fh2>\n    <p style=\"margin:0;font-size:15px;color:#6A6785\">SpO₂ 88% — below the configured emergency threshold.<\u002Fp>\n    <div style=\"margin-top:16px;display:flex;gap:10px;flex-wrap:wrap\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goAssessment }}\" style=\"appearance:none;border:0;cursor:pointer;background:#E5484D;color:#fff;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:11px\">Review patient →<\u002Fbutton>\n      <button type=\"button\" style=\"appearance:none;border:1px solid #E9B4B4;background:#fff;cursor:pointer;color:#C13238;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:11px\">Escalate to senior<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;border:1px solid #F7DFB4;border-left:5px solid #F5A623;border-radius:18px;padding:22px 26px\">\n    <div style=\"font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:#9A6207;font-weight:800\">Important<\u002Fdiv>\n    <h2 style=\"margin:10px 0 10px;font-size:21px;font-weight:800\">Multiple abnormal physiological values<\u002Fh2>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <span style=\"background:#FFF3E0;color:#9A6207;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700\">Heart rate 122<\u002Fspan>\n      <span style=\"background:#FFF3E0;color:#9A6207;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700\">Respiratory rate 28<\u002Fspan>\n      <span style=\"background:#FFF3E0;color:#9A6207;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700\">SpO₂ 88%<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:15px;color:#6A6785\">Together, these findings increase clinical urgency.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;border:1px solid #DEDCF4;border-left:5px solid #7C5CFC;border-radius:18px;padding:22px 26px\">\n    <div style=\"font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:#5B3CC4;font-weight:800\">Information missing<\u002Fdiv>\n    <h2 style=\"margin:10px 0 10px;font-size:21px;font-weight:800\">Important investigations have not been performed<\u002Fh2>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <span style=\"background:#EFEEFB;color:#5B3CC4;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700\">D-dimer<\u002Fspan>\n      <span style=\"background:#EFEEFB;color:#5B3CC4;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700\">Creatinine<\u002Fspan>\n      <span style=\"background:#EFEEFB;color:#5B3CC4;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700\">Temperature<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:15px;color:#6A6785\">These tests have not been performed. They should not be interpreted as normal.<\u002Fp>\n    <button type=\"button\" sc-camel-on-click=\"{{ goAssessment }}\" style=\"margin-top:16px;appearance:none;border:1px solid #B9B5EC;background:#fff;cursor:pointer;color:#5B3CC4;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:11px\">View missing information →<\u002Fbutton>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onAssistant }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;max-width:1180px\">\n  <div style=\"background:#fff;border:1px solid #E4E2F8;border-radius:22px;box-shadow:0 6px 20px rgba(91,60,196,.06);display:flex;flex-direction:column;overflow:hidden;min-height:620px;flex:1 1 420px;min-width:0\">\n    <div style=\"padding:20px 26px;border-bottom:1px solid #F1EDFF;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap\">\n      <div style=\"display:flex;gap:13px;align-items:center\">\n        <span style=\"width:40px;height:40px;border-radius:12px;background:#5B54D6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px\">✨<\u002Fspan>\n        <div><div style=\"font-weight:800;font-size:16px\">Clinical assistant<\u002Fdiv><div style=\"font-size:13px;color:#6A6785\">I'm here to help you review this case.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#F0FADB;color:#5A7A0F;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700\">● 74F — acute breathlessness<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;padding:24px 26px;display:flex;flex-direction:column;gap:16px;overflow:auto\">\n      <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <div style=\"{{ m.rowStyle }}\">\n          <div style=\"{{ m.bubbleStyle }}\">{{ m.text }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"padding:18px 26px 22px;border-top:1px solid #E9E8FB\">\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px\">\n        <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"appearance:none;border:1px solid #DEDCF4;background:#FAFAFE;cursor:pointer;color:#5B3CC4;font-weight:600;font-size:13px;padding:9px 14px;border-radius:999px\" style-hover=\"border-color:#B9B5EC;background:#EFEEFB\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;gap:12px;align-items:center\">\n        <input value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" placeholder=\"Ask about this patient…\" style=\"flex:1;border:1px solid #DEDCF4;border-radius:13px;padding:13px 16px;font-size:14.5px;background:#FCFBFF\">\n        <button type=\"submit\" style=\"appearance:none;border:0;cursor:pointer;background:#5B54D6;color:#fff;font-weight:700;font-size:15px;padding:13px 20px;border-radius:13px\">➤<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:18px;flex:1 1 280px;min-width:0\">\n    <div style=\"background:#fff;border:1px solid #E4E2F8;border-radius:20px;padding:22px 24px\">\n      <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C5CFC;font-weight:800\">Patient context<\u002Fdiv>\n      <p style=\"margin:10px 0 0;font-size:13.5px;color:#6A6785;text-wrap:pretty\">The assistant keeps everything entered during this encounter, so you don't need to repeat the patient information.<\u002Fp>\n      <div style=\"margin-top:16px;display:flex;flex-direction:col ine — and reassessing the respiratory status. A documented temperature would also help weigh an infective cause.\",\n  fallback: \"Based on the information recorded for this patient, the findings that carry most weight are the B-lines, the reduced oxygen saturation and the raised BNP. Several investigations are still unavailable, so the assessment remains uncertain and warrants your review.\"\n};\n\nconst SUGGESTIONS = [\n  ['What findings support pulmonary edema?', 'support'],\n  ['What information is missing?', 'missing'],\n  ['Why is PE still in the differential?', 'pe'],\n  ['Summarize this patient.', 'summary'],\n  ['What should I investigate next?', 'next']\n];\n\nconst TIMELINE = [\n  ['09:02', 'Patient registered', 'Self-presenting, Bed 4', false],\n  ['09:07', 'Clinical information entered', 'Age, sex, chief complaint, symptoms', false],\n  ['09:11', 'Vital signs recorded', 'SpO₂ 88%, HR 122, RR 28, BP 104/68', false],\n  ['09:13', 'Laboratory results added', 'BNP 890, lactate 2.6', false],\n  ['09:14', 'POCUS examination uploaded', 'Lung — 2 clips, 6 zones', false],\n  ['09:15', 'Clinical assessment generated', 'High priority · pulmonary edema leading', true],\n  ['09:17', 'Alerts raised', 'Oxygenation compromised · missing investigations', false],\n  ['09:19', 'Troponin result added', '62 ng/L — high', false],\n  ['09:20', 'Assessment updated', 'Acute cardiac injury added to the differential', true]\n];\n\nconst BARS = [\n  ['Pulmonary\\nedema', 62, 22],\n  ['Pulmonary\\nembolism', 34, 41],\n  ['Pneumonia', 21, 58],\n  ['Pneumothorax', 12, 30],\n  ['Cardiac\\ninjury', 38, 34],\n  ['COPD\\nexacerbation', 18, 62],\n  ['Anemia', 9, 71],\n  ['Sepsis', 15, 66]\n];\n\nconst SATS = [96,95,94,96,93,92,94, 92,91,93,90,91,89,90, 90,89,88,89,88,87,88, 88,88,87,88,88,88,88];\n\nconst VISITS = [\n  {\n    date: '24 Aug 2026', reason: 'Acute breathlessness',\n    meta: 'Lung POCUS · 3 clips', tag: 'Critical', outcome: 'Pulmonary edema leading · under review',\n    imag ging gaps'\n];\n\nconst VITALS = [\n  ['Heart rate', '122', 'bpm', 'High'],\n  ['SpO₂', '88', '%', 'Low'],\n  ['Respiratory rate', '28', '/min', 'High'],\n  ['Blood pressure', '104/68', 'mmHg', 'Normal'],\n  ['Temperature', '', '°C', ''],\n  ['Weight', '78', 'kg', '']\n];\n\nconst LABS = [\n  ['BNP', '890 pg/mL', 'High'],\n  ['Troponin', '62 ng/L', 'High'],\n  ['Lactate', '2.6 mmol/L', 'High'],\n  ['D-dimer', '', ''],\n  ['Creatinine', '', '']\n];\n\nconst POCUS_FIELDS = [\n  ['B-lines', 'Detected'],\n  ['Pleural effusion', 'Not detected'],\n  ['Consolidation', 'Not detected'],\n  ['Pleural thickening', 'Not detected'],\n  ['Pneumothorax', 'Not assessed']\n];\n\nconst RANKED = [\n  ['01', 'Pulmonary edema', 'Most likely', 62,\n    'B-lines bilaterally, SpO₂ 88%, HR 122, RR 28, BNP elevated',\n    'Key investigations unavailable; the scan cannot establish normality'],\n  ['02', 'Acute cardiac injury', 'Possible', 38,\n    'Troponin elevated at 62 ng/L alongside the respiratory picture',\n    'No ECG recorded; a single troponin cannot show a trend'],\n  ['03', 'Pulmonary embolism', 'Not excluded', 34,\n    'Tachycardia and tachypnea are compatible',\n    'D-dimer not measured; nothing available can exclude it'],\n  ['04', 'Pneumothorax', 'Cannot be excluded', 12,\n    'Would explain the hypoxemia',\n    'The current examination does not assess this condition']\n];\n\nconst REC_TABS = [\n  ['images', 'POCUS images'],\n  ['data', 'Measurements'],\n  ['visits', 'Visits'],\n  ['reports', 'Reports']\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'home',\n    recTab: 'images',\n    phase: 'idle',\n    stepsDone: 0,\n    draft: '',\n    messages: [\n      { role: 'a', text: \"I reviewed Sarah Martin's clinical information. What would you like to know about this patient?\" }\n    ]\n  };\n\n  componentDidMount() {\n    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ grown: true })));\n  }\n\n  go(id) { return () => this.setState({ screen: id }); }\n\n  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }\n\n  analyze() {\n    (this.timers || []).forEach(clearTimeout);\n    this.timers = [];\n    this.setState({ phase: 'running', stepsDone: 0 });\n    const total = ANALYZE_STEPS.length;\n    for (let i = 1; i <= total; i++) {\n      this.timers.push(setTimeout(() => this.setState({ stepsDone: i }), i * 480));\n    }\n    this.timers.push(setTimeout(() => this.setState({ phase: 'done' }), total * 480 + 320));\n  }\n\n  push(q, key) {\n    this.setState(s => ({\n      screen: 'assistant',\n      draft: '',\n      messages: s.messages.concat([{ role: 'd', text: q }, { role: 'a', text: ANSWERS[key] || ANSWERS.fallback }])\n    }));\n  }\n\n  navStyle(id) {\n    const on = this.state.screen === id;\n    return {\n      appearance: 'none', border: 0, cursor: 'pointer', textAlign: 'left', width: '100%',\n      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px',\n      padding: '12px 16px', borderRadius: '8px',\n      background: on ? '#E9E8FB' : 'transparent',\n      color: on ? '#2E2A78' : '#6A6785',\n      fontWeight: on ? 700 : 500, fontSize: '14.5px',\n      boxShadow: on ? 'inset 3px 0 0 #5B54D6' : 'none'\n    };\n  }\n\n  renderVals() {\n    const v = {\n      nav: SCREENS.map(s => ({\n        label: s.label, icon: s.icon, badge: s.badge || '',\n        style: this.navStyle(s.id),\n        onClick: this.go(s.id),\n        badgeStyle: s.badge\n          ? { background: s.id === 'alerts' ? '#FDECEC' : '#E4E2F8', color: s.id === 'alerts' ? '#C13238' : '#5B3CC4', borderRadius: '999px', padding: '3px 9px', fontSize: '11.5px', fontWeight: 700 }\n          : { display: 'none' }\n      })),\n      messages: this.state.messages.map(m => ({\n        text: m.text,\n        rowStyle: { display: 'flex', justifyContent: m.role === 'd' ? 'flex-end' : 'flex-start' },\n        bubbleStyle: m.role === 'd'\n          ? { maxWidth: '74%', background: '#5B54D6', color: '#fff', padding: '14px 18px', borderRadius: '16px 16px 4px 16px', fontSize: '14.5px', lineHeight: 1.55 }\n          : { maxWidth: '78%', background: '#F4F3FD', border: '1px solid #E4E2F8', color: '#1B1A3A', padding: '14px 18px', borderRadius: '16px 16px 16px 4px', fontSize: '14.5px', lineHeight: 1.6 }\n      })),\n      suggestions: SUGGESTIONS.map(([label, key]) => ({ label, onClick: () => this.push(label, key) })),\n      timeline: TIMELINE.map(([time, title, detail, hl]) => ({\n        time, title, detail,\n        dotStyle: { width: '13px', height: '13px', borderRadius: '50%', marginTop: '5px', background: hl ? '#5B3CC4' : '#fff', border: hl ? '3px solid #D9CDFF' : '3px solid #DEDCF4', display: 'block' },\n        titleStyle: { fontWeight: hl ? 800 : 600, fontSize: '15.5px', color: hl ? '#2E2A78' : '#1B1A3A' }\n      })),\n      bars: BARS.map(([label, sup, ag]) => ({\n        label: label.replace('\\n', ' '),\n        barStyle: (() => {\n          const total = sup + ag;\n          const split = Math.round(sup / total * 100);\n          return {\n            width: '100%', maxWidth: '46px',\n            height: this.state.grown ? Math.max(sup, ag) + '%' : '0%',\n            transition: 'height .8s cubic-bezier(.2,.8,.25,1)',\n            background: 'linear-gradient(180deg,#5B54D6 0 ' + split + '%,#2E2A78 ' + split + '% 100%)'\n          };\n        })()\n      })),\n      heat: SATS.map(v => ({\n        style: {\n          display: 'block', aspectRatio: '1', borderRadius: '2px',\n          background: v >= 95 ? '#FADBDC' : v >= 92 ? '#F4AFB2' : v >= 90 ? '#EC8085' : '#E5484D'\n        }\n      })),\n      recordTabs: REC_TABS.map(([id, label]) => ({\n        label,\n        onClick: () => this.setState({ recTab: id }),\n        style: {\n          appearance: 'none', cursor: 'pointer', borderRadius: '8px',\n          padding: '11px 18px', fontWeight: 700, fontSize: '14px',\n          background: this.state.recTab === id ? '#5B54D6' : '#fff',\n          color: this.state.recTab === id ? '#fff' : '#6A6785',\n          border: this.state.recTab === id ? '1px solid #5B54D6' : '1px solid #DEDCF4'\n        }\n      })),\n      recImages: this.state.recTab === 'images',\n      recData: this.state.recTab === 'data',\n      recVisits: this.state.recTab === 'visits',\n      recReports: this.state.recTab === 'reports',\n      visits: VISITS.map(v => ({\n        date: v.date, reason: v.reason, meta: v.meta, outcome: v.outcome,\n        images: v.images.map((im, i) => Object.assign({}, im, { slotId: 'pocus-' + v.date.replace(/\\W+/g, '') + '-' + i })), tag: v.tag,\n        onOpen: this.go('report'),\n        tagStyle: {\n          borderRadius: '999px', padding: '5px 12px', fontSize: '12.5px', fontWeight: 700,\n          background: v.tag === 'Critical' ? '#FDECEC' : '#F0FADB',\n          color: v.tag === 'Critical' ? '#C13238' : '#5A7A0F'\n        }\n      })),\n      dataRows: DATA_ROWS.map(([name, now, flag, v2, v3, v4]) => ({\n        name, now, v2: v2 || '—', v3: v3 || '—', v4: v4 || '—',\n        nowStyle: { padding: '13px 0', fontWeight: 700, color: flag ? '#C13238' : '#1B1A3A' }\n      })),\n      filledCount: 4,\n      analyzing: this.state.phase === 'running',\n      analyzed: this.state.phase === 'done',\n      analyzeLabel: this.state.phase === 'done' ? '✦ Re-analyze' : this.state.phase === 'running' ? 'Analyzing…' : '✦ Analyze this patient',\n      onAnalyze: () => this.analyze(),\n      steps: ANALYZE_STEPS.map((label, i) => {\n        const done = i < this.state.stepsDone;\n        const active = i === this.state.stepsDone;\n        return {\n          label,\n          dotStyle: {\n            width: '11px', height: '11px', borderRadius: '50%', flex: '0 0 auto',\n            background: done ? '#C6F24E' : active ? '#5B54D6' : '#DEDCF4',\n            animation: active ? 'pulseDot 1.1s ease-in-out infinite' : 'none'\n          },\n          textStyle: { color: done || active ? '#1B1A3A' : '#9C99B8', fontWeight: active ? 700 : 500 }\n        };\n      }),\n      vitalFields: VITALS.map(([label, value, unit, flag]) => ({\n        label, value, unit, flag: flag || (value ? '' : 'Not measured'),\n        inputStyle: {\n          border: '1px solid ' + (flag === 'High' || flag === 'Low' ? '#F0BFC1' : '#DEDCF4'),\n          borderRadius: '8px', padding: '10px 12px', fontSize: '15px', fontWeight: 700,\n          background: flag === 'High' || flag === 'Low' ? '#FFF6F6' : '#FAFAFE', color: '#1B1A3A'\n        },\n        flagStyle: {\n          fontSize: '11.5px', fontWeight: 700,\n          color: flag === 'High' || flag === 'Low' ? '#C13238' : flag === 'Normal' ? '#5A7A0F' : '#9C99B8'\n        }\n      })),\n      labFields: LABS.map(([name, value, flag]) => ({\n        name, value, flag: flag || 'Not measured',\n        nameStyle: { fontSize: '14.5px', fontWeight: 600, color: value ? '#1B1A3A' : '#9C99B8' },\n        inputStyle: {\n          border: '1px solid ' + (flag ? '#F0BFC1' : '#DEDCF4'), borderRadius: '8px',\n          padding: '9px 11px', fontSize: '14px', fontWeight: 700,\n          background: flag ? '#FFF6F6' : '#FAFAFE', color: '#1B1A3A', width: '100%'\n        },\n        flagStyle: {\n          fontSize: '11.5px', fontWeight: 700, textAlign: 'right',\n          color: flag === 'High' ? '#C13238' : '#9C99B8'\n        }\n      })),\n      pocusFields: POCUS_FIELDS.map(([name, value]) => ({\n        name, value,\n        nameStyle: { fontWeight: 600, color: value === 'Not assessed' ? '#9C99B8' : '#1B1A3A' },\n        segStyle: {\n          borderRadius: '999px', padding: '5px 13px', fontSize: '12.5px', fontWeight: 700,\n          background: value === 'Detected' ? '#5B54D6' : value === 'Not assessed' ? '#EFEEFB' : '#F0FADB',\n          color: value === 'Detected' ? '#fff' : value === 'Not assessed' ? '#9C99B8' : '#5A7A0F'\n        }\n      })),\n      ranked: RANKED.map(([rank, name, tag, pct, supports, limits], i) => ({\n        rank, name, tag, supports, limits,\n        cardStyle: {\n          border: i === 0 ? '2px solid #5B54D6' : '1px solid #E4E2F8',\n          borderRadius: '12px', padding: '20px 22px',\n          background: i === 0 ? '#FAFAFE' : '#fff',\n          animation: 'riseIn .5s ' + (i * 0.08).toFixed(2) + 's cubic-bezier(.2,.7,.3,1) both'\n        },\n        titleStyle: { fontSize: i === 0 ? '21px' : '18px', fontWeight: 800, letterSpacing: '-.012em' },\n        tagStyle: {\n          borderRadius: '999px', padding: '6px 14px', fontSize: '12.5px', fontWeight: 800,\n          background: i === 0 ? '#5B54D6' : '#E9E8FB', color: i === 0 ? '#fff' : '#2E2A78'\n        },\n        fillStyle: {\n          width: pct + '%', height: '100%',\n          background: i === 0 ? '#5B54D6' : '#8E88E8',\n          transformOrigin: 'left', animation: 'growRight .6s ease both'\n        }\n      })),\n      zones: [\n        ['R1', 'pos'], ['R2', 'pos'], ['L1', 'pos'], ['L2', 'pos'],\n        ['R3', 'neg'], ['R4', 'neg'], ['L3', 'none'], ['L4', 'none']\n      ].map(([label, k], i) => ({\n        label,\n        style: {\n          aspectRatio: '1', borderRadius: '6px', display: 'flex',\n          alignItems: 'center', justifyContent: 'center',\n          fontWeight: 800, fontSize: '13.5px',\n          background: k === 'pos' ? '#5B54D6' : k === 'neg' ? '#C6F24E' : '#E4E2F8',\n          color: k === 'pos' ? '#fff' : '#1B1A3A',\n          animation: 'riseIn .45s ' + (i * 0.05).toFixed(2) + 's cubic-bezier(.2,.7,.3,1) both'\n        }\n      })),\n      draft: this.state.draft,\n      onDraft: e => this.setState({ draft: e.target.value }),\n      onSubmit: e => {\n        e.preventDefault();\n        const q = (this.state.draft || '').trim();\n        if (q) this.push(q, 'fallback');\n      },\n      askWhy: () => this.push('Why is pulmonary edema ranked first?', 'why'),\n      askChallenge: () => this.push('Challenge this assessment.', 'challenge'),\n      askBLines: () => this.push('Explain what the detected B-lines could mean in this patient.', 'blines')\n    };\n    SCREENS.forEach(s => {\n      const cap = s.id[0].toUpperCase() + s.id.slice(1);\n      v['on' + cap] = this.state.screen === s.id;\n      v['go' + cap] = this.go(s.id);\n    });\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
